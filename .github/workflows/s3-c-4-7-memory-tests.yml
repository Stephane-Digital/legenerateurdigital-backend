name: S3.C.4.7.C - Memory regression tests
on:
  push:
    branches: [test/s3-c-4-7-memory]
permissions:
  contents: read
jobs:
  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile changed modules
        run: python -m py_compile services/alex_conversation_service.py services/ai/coach_ai.py
      - name: Test isolated memory functions
        run: |
          python <<'PY'
          import ast
          from pathlib import Path
          from typing import Any, Dict, List
          source = Path("services/alex_conversation_service.py").read_text()
          tree = ast.parse(source)
          names = {"MAX_MESSAGES", "MAX_USER_CHARS", "MAX_ASSISTANT_CHARS", "MAX_CONTEXT_MESSAGES", "MAX_CONTEXT_CHARS"}
          nodes = [n for n in tree.body if (isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id in names for t in n.targets)) or (isinstance(n, ast.FunctionDef) and n.name in {"_text", "compact_history"})]
          ns = {"Any": Any, "Dict": Dict, "List": List}
          exec(compile(ast.Module(body=nodes, type_ignores=[]), "<memory>", "exec"), ns)
          compact = ns["compact_history"]
          def turn(role, content):
              return {"role": role, "content": content}
          assert compact([]) == []
          assert compact([turn("assistant", "Court")]) == [turn("assistant", "Court")]
          user = "x" * 1490 + "DECISION"
          assert compact([turn("user", user)])[0]["content"] == user
          answer = "SOMMAIRE" + "x" * 10000 + "INTRODUCTION TERMINEE"
          excerpt = compact([turn("assistant", answer)])[0]["content"]
          assert len(excerpt) == 750 and excerpt.startswith("SOMMAIRE") and excerpt.endswith("INTRODUCTION TERMINEE")
          assert "passage intermédiaire omis" in excerpt
          assert len(compact([turn("user", str(i)) for i in range(20)])) == 8
          assert compact([turn("system", "invalid")]) == []
          assert compact([turn("user", "  ")]) == []
          history = compact([turn("user", "u"*1500), turn("assistant", "a"*40000)]*4)
          assert sum(len(t["content"]) for t in history) <= 9000
          coach = Path("services/ai/coach_ai.py").read_text()
          assert '1500 if mode == "conversation" and entry["role"] == "user" else 750' in coach
          assert "Un extrait historique incomplet" in coach
          print("Memory excerpt regression checks passed")
          PY
